<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#9155fd">
    <title>EZBus Offline</title>
    <style>
      :root {
        color: #3a3541;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f6fa;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(420px, 100%);
        padding: 28px;
        border: 1px solid rgba(58, 53, 65, .1);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 16px 40px rgba(58, 53, 65, .08);
      }

      img {
        width: 52px;
        height: 52px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }

      p {
        margin: 0 0 22px;
        color: #6e6b78;
        line-height: 1.55;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        color: #fff;
        background: #9155fd;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/driver-icon.svg" alt="EZBus">
      <h1>Anda sedang offline</h1>
      <p>Koneksi internet dibutuhkan untuk memuat data terbaru, login, dan mengirim lokasi perjalanan.</p>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
